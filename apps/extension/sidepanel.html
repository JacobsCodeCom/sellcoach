<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mira</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <p class="brand">Mira</p>
      <p id="bootStatus" class="muted">Opening Mira…</p>
      <div id="originControls" class="origin-controls" hidden>
        <label class="origin-field">
          <span>Mira URL (local only)</span>
          <input id="origin" type="url" spellcheck="false" placeholder="http://localhost:3000" />
        </label>
        <div class="origin-actions">
          <button id="reload" type="button">Open</button>
          <button id="useLocalhost" type="button" class="btn-secondary">Use localhost:3000</button>
        </div>
      </div>
      <p id="error" class="error" hidden></p>
    </div>
    <div id="devBar" class="dev-bar" hidden>
      <button id="toggleDevBar" type="button" class="dev-bar-toggle" aria-expanded="false" title="Show Mira URL">
        URL
      </button>
      <div id="devBarPanel" class="dev-bar-panel" hidden>
        <span id="devBarOrigin" class="dev-bar-origin"></span>
        <button id="changeOrigin" type="button">Change</button>
        <button id="hideDevBar" type="button" class="dev-bar-hide" title="Hide URL bar" aria-label="Hide URL bar">×</button>
      </div>
    </div>
    <iframe
      id="frame"
      title="Mira"
      allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write"
      hidden
    ></iframe>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
